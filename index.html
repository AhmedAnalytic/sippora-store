<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arawat Store · Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col items-center p-4 md:p-8 antialiased">

  <!-- Header -->
  <header class="w-full max-w-6xl flex justify-between items-center mb-10 pb-4 border-b border-white/50">
    <h1 class="text-2xl font-bold text-gray-800">Sippora<span class="text-blue-600">Store</span></h1>
    <div class="text-sm text-gray-500"><i class="fas fa-shopping-bag mr-1"></i> Shop Collection</div>
  </header>

  <!-- Product Grid -->
  <main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    
    <!-- Product 1 Card (Your Queen Mug) -->
    <a href="queen-mug.html" class="product-card block bg-white/70 backdrop-blur-sm rounded-3xl p-4 border border-white/50 transition-all duration-300">
      <div class="relative bg-gradient-to-br from-slate-50 to-blue-50/70 rounded-2xl flex items-center justify-center p-6 min-h-[250px] overflow-hidden">
        <div class="absolute top-2 left-2 text-2xl crown-float z-10 select-none">
          <i class="fas fa-crown text-amber-400 drop-shadow-md"></i>
        </div>
        <img src="images/DarkBlueCoffeeMug.png" alt="Queen of Everything Mug" class="product-img w-full max-w-[200px]">
      </div>
      <div class="p-4">
        <div class="flex items-center stars text-xs mb-2">
          <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
          <span class="ml-1 text-gray-600">(529)</span>
        </div>
        <h2 class="text-lg font-bold text-gray-800 mb-1">Queen of Everything Mug</h2>
        <p class="text-sm text-gray-500 mb-3">Dark Blue Ceramic · 12 oz</p>
        <div class="flex items-center gap-2">
          <span class="text-xl font-extrabold text-gray-900">$17.84</span>
          <span class="text-sm text-gray-400 line-through">$18.98</span>
        </div>
      </div>
    </a>

        <!-- Product 2 Card (ONEUSTAR Tea Cup) -->
    <a href="rose-teacup.html" class="product-card block bg-white/70 backdrop-blur-sm rounded-3xl p-4 border border-white/50 transition-all duration-300">
      <div class="relative bg-gradient-to-br from-rose-50 to-white rounded-2xl flex items-center justify-center p-6 min-h-[250px] overflow-hidden">
        <div class="absolute top-2 left-2 text-2xl crown-float z-10 select-none">
          <i class="fas fa-spa text-rose-400 drop-shadow-md"></i>
        </div>
        <!-- Make sure your image is saved here -->
        <img src="images/RedTeaCup.png" alt="ONEUSTAR Rose Tea Cup" class="product-img w-full max-w-[200px]">
      </div>
      <div class="p-4">
        <div class="flex items-center stars text-xs mb-2">
          <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
          <span class="ml-1 text-gray-600">(210)</span>
        </div>
        <h2 class="text-lg font-bold text-gray-800 mb-1">ONEUSTAR Rose Tea Cup</h2>
        <p class="text-sm text-gray-500 mb-3">3D Flower Ceramic Set · 6 oz</p>
        <div class="flex items-center gap-2">
          <span class="text-xl font-extrabold text-gray-900">$22.99</span>
        </div>
      </div>
    </a>
        <!-- Product 3 Card (Tulip Mug) -->
    <a href="pink-tulip-mug.html" class="product-card block bg-white/70 backdrop-blur-sm rounded-3xl p-4 border border-white/50 transition-all duration-300">
      <div class="relative bg-gradient-to-br from-pink-50 to-white rounded-2xl flex items-center justify-center p-6 min-h-[250px] overflow-hidden">
        <div class="absolute top-2 left-2 text-2xl crown-float z-10 select-none">
          <i class="fas fa-seedling text-pink-400 drop-shadow-md"></i>
        </div>
        <img src="images/PinkTulipMug.png" alt="Ceramic Tulip Coffee Mug" class="product-img w-full max-w-[200px]">
      </div>
      <div class="p-4">
        <div class="flex items-center stars text-xs mb-2">
          <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
          <span class="ml-1 text-gray-600">(154)</span>
        </div>
        <h2 class="text-lg font-bold text-gray-800 mb-1">Ceramic Tulip Coffee Mug</h2>
        <p class="text-sm text-gray-500 mb-3">14 oz · Pearl Gloss · with Spoon</p>
        <div class="flex items-center gap-2">
          <span class="text-xl font-extrabold text-gray-900">$14.99</span>
        </div>
      </div>
    </a>
  </main>
</body>
</html>
